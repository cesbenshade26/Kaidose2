name: kaidose
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Version number is three numbers separated by dots, followed by an optional
# build number after a +. Android: build-name = versionName, build-number =
# versionCode. iOS: CFBundleShortVersionString / CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  video_player: ^2.9.1
  #contacts_service: ^0.6.3
  firebase_core: ^4.12.1       # Matches Firebase iOS SDK 12.9.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  flutter_image_compress: ^2.1.0
  firebase_storage: ^13.6.0
  share_plus: ^12.0.2
  cross_file: ^0.3.5+2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  firebase_ai: ^4.0.0
  video_thumbnail: ^0.5.6
  cached_network_image: ^4.0.4
  audioplayers: ^6.8.1
  ffmpeg_kit_flutter_new: ^4.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Temporary: fixes the flutter_launcher_icons build error. Safe to delete
# after the icons have been generated.
dependency_overrides:
  image: 4.5.4

# App icon settings. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: Slackey
      fonts:
        - asset: assets/fonts/Slackey-Regular.ttf
